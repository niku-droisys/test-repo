name: Go setup

on:
  push:
    branches: [ "a360-python" ]
  pull_request:
    branches: [ "a360-python" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go version

    - name: Test
      run: go version